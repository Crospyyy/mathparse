[package]
name = "quickmafs"
version = "0.1.0"
edition = "2024"

[dependencies]
library = { path = "../library" }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
eframe = "0.37.0"
regex = "1.11.2"
chrono = "0.4.42"
anyhow = "1.0.100"
lazy_static = "1.5.1"

[target.'cfg(windows)'.dependencies]
global_shortcuts = { path = "../basically_a_keylogger" }

[target.'cfg(target_os = "linux")'.dependencies]
linux_shortcuts = { path = "../linux_shortcuts" }
winit = { version = "0.30", default-features = false, features = [
    "x11",
    "rwh_06",
] }
x11rb = "0.13"

[package.metadata.generate-rpm]
name = "Quickmafs"
description = "An intuitive and quick calculator."
license = "GPL-3.0-or-later"
assets = [
    { source = "../target/release/quickmafs", dest = "/usr/bin/io.github.crospyyy.mathparse", mode = "755" },
    { source = "../res/mathparse.desktop", dest = "/usr/share/applications/io.github.crospyyy.mathparse.desktop", mode = "644" },
    { source = "../res/mathparse.metainfo.xml", dest = "/usr/share/metainfo/io.github.crospyyy.mathparse.metainfo.xml", mode = "644" },
    { source = "../res/quickmafs.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github.crospyyy.mathparse.png", mode = "644" },
    { source = "../LICENSE", dest = "/usr/share/licenses/io.github.crospyyy.mathparse/LICENSE", mode = "644" },
]
