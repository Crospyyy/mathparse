[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
library = { path = "../library" }
egui = "0.37.0"
eframe = "0.37.0"
regex = "1.11.2"
chrono = "0.4.42"
anyhow = "1.0.100"
lazy_static = "1.5.1"

[target.'cfg(windows)'.dependencies]
global_shortcuts = { path = "../basically_a_keylogger" }

[target.'cfg(target_os = "linux")'.dependencies]
linux_shortcuts = { path = "../linux_shortcuts" }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
x11rb = "0.13"
